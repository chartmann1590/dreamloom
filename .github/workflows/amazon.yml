name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, built with -Pstore=amazon (no Google Play
# links, no Play in-app review prompt). Run on an emulator without Google Play services (like Fire).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Decode signing keystore
      env:
        ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      run: "if [ -z \"$ANDROID_KEYSTORE_B64\" ]; then\n  echo \"ANDROID_KEYSTORE_B64 secret is missing.\"\n  exit 1\nfi\necho \"$ANDROID_KEYSTORE_B64\" | base64 --decode > \"$RUNNER_TEMP/release.keystore\"\n"
    - name: Build amazon APKs (store=amazon)
      env:
        MODEL_SHA256: ${{ secrets.DREAMLOOM_MODEL_SHA256 }}
        APP_VERSION_CODE: ${{ github.run_number }}
      run: "set -o pipefail\nif [ -z \"$MODEL_SHA256\" ]; then\n  echo \"DREAMLOOM_MODEL_SHA256 secret is missing.\"\n  exit 1\nfi\nif grep -Eni 'ca-app-pub-3940256099942544|REPLACE_ME|ca-app-pub-XXXXXXXXXXXXXXXX' app/src/main/res/values/ads.xml; then\n  echo \"ads.xml appears to contain test/placeholder ad IDs. Refusing release build.\"\n  exit 1\nfi\nchmod +x ./gradlew\n./gradlew :app:assembleRelease -Pstore=amazon  \\\n  -Pdreamloom.modelSha256=\"$MODEL_SHA256\" \\\n  -x lintVitalRelease 2>&1 | tee -a /tmp/amz-build.log\nmkdir -p amz-apk\ncp \"$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1 || ls app/build/outputs/apk/release/*.apk | head -1)\" amz-apk/Dreamloom-amazon-release.apk\nls -la amz-apk\nBT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)\n$BT/apksigner verify --print-certs amz-apk/Dreamloom-amazon-release.apk | head -3 || true\n$BT/aapt2 dump badging amz-apk/Dreamloom-amazon-release.apk | head -3 || true\n\
        echo \"--- Play Store URL strings left in the amazon release dex:\"; unzip -p amz-apk/Dreamloom-amazon-release.apk 'classes*.dex' | strings | grep -E \"play\\.google\\.com/store|market://\" | head || true\n"
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_Dreamloom_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/Dreamloom-amazon-release.apk
